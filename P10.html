<html>
      <head>
            <title>Form Validation</title>
      </head>
      <body>
            <h1>FORM VALIDATION</h1>
            <form name = "form" action = "" onsubmit = "return validateForm()">
                  <label>Name : </label>
                  <select name = "init" id = "init">
                          <option>Mr.</option>
                          <option>Mrs.</option>
                          <option>Ms.</option>
                  </select>
                  <input type="text" id = "fname" placeholder="Enter your Name"><br><br>
                  <label>Phone : </label>
                  <select name = "num" id = "num">
                          <option>+91</option>
                          <option>+966</option>
                          <option>+971</option>
                  </select>
                  <input type="tel" id = "phone" placeholder="Enter Mobile number"><br><br>
                  <label>Email : </label>
                  <input type="text" id = "email" placeholder="Enter your email"><br><br>
                  <button type="submit">Submit</button>
            </form>
            <script>
                    function validateForm()
                    {
                       var fname = document.form.fname.value.trim();
                       var phone = document.form.phone.value.trim();
                       var email = document.form.email.value.trim();
                    
                       if(fname == "")
                       {
                          alert("Enter your Name");
                          document.form.fname.focus();
                          return false;
                       }
                       else if(!/^[a-zA-Z]+$/.test(fname))
                       {  
                          alert("Enter valid Name");
                          document.form.fname.focus();
                          return false;
                       }
                       if(phone == "")
                       {
                          alert("Enter Mobile Number");
                          document.form.phone.focus();
                          return false;
                       }
                       else if(!/^[0-9]{10}$/.test(phone))
                       {
                          alert("Enter a valid 10-digit Mobile Number");
                          document.form.phone.focus();
                          return false;
                       }
                       if(email == "")
                       {
                          alert("Enter email");
                          document.form.email.focus();
                          return false;
                       }
                       else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
                       {
                          alert("Enter a valid email");
                          document.form.email.focus();
                          return false;
                       }
                       alert("Form Submitted Successfully");
                       return true;
                    }
            </script>
      </body>
</html>

<html>
      <head>
            <title>PROGRAM 8</title>
            <style>
                   h3{
                           margin-left: 600px;
                        }

                   button {
                            margin-left : 700px;
                            margin-top : 300px;
                            padding : 20px;
                          }

    </style>
      </head>
      <body>
            <button onClick="background()">Click Me</button>
            <h3>To change Background color</h3>
            <script>
                   function background()
                    {
                       var r = Math.floor(Math.random()*256);
                       var g = Math.floor(Math.random()*256);
                       var b = Math.floor(Math.random()*256);
                           
                      document.body.style.backgroundColor="rgb("+r+","+g+","+b+")";
                    } 
            </script>
      </body>
</html>

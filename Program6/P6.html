<html>
   <head>
      <title>Registration Form</title>
      <link rel="stylesheet" href="P6.css">
   </head>
   <body>
      <h1 class="h1">REGISTRATION FORM</h1>
      <form>
      <fieldset>
         <legent>User Information</legent><br><br>
         <label>Name</label>
         <select>
              <option>Mr.</option>
              <option>Mrs.</option>
              <option>Ms.</option>
         </select>
         <input type="text"><br><br><br>

         <label>Phone</label>
         <input type="tel">

         <label>Email</label>
         <input type="email">
      </fieldset>

      <br><br>
      <label>Address</label>
      <textarea required></textarea>  <br><br>

      <label>Gender</label>
      <input type="radio" name="gender" required><label>Male</label>
      <input type="radio" name="gender" required><label>Female</label>
      <input type="radio" name="gender" required><label>Other</label>
      <br><br>
      <label>Language Known</label>
      <input type="checkbox" required><label>English</label>
      <input type="checkbox" required><label>Malayalam</label>
      <input type="checkbox" required><label>Tamil</label>
      <input type="checkbox" required><label>Hindi</label>
      <br><br>
      <label>Course</label>
      <select>
              <option>Course</option>
              <option>BBA</option>
              <option>BCA</option>
              <option>MBA</option>
              <option>MCA</option>
      </select> <br><br>
      <div class="buttons">
         <button type="reset">Reset</button>
         <button type="submit">Submit</button>
      </div>
     </form>
   </body>
</html>
